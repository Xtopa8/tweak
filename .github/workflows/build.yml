name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid FIRST
        run: |
          brew install ldid
          which ldid
          ldid -v 2>&1 | head -2 || true

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          if [ -d /tmp/sdks/iPhoneOS14.5.sdk ]; then
            cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/
          else
            SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | head -1)
            cp -R "$SDK" $THEOS/sdks/
          fi
          ls $THEOS/sdks/

      - name: Build
        run: |
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee build.log
          echo "=== dylib files ==="
          find .theos -name "*.dylib" -exec ls -la {} \;

      - name: Collect and verify
        run: |
          mkdir -p /tmp/out
          find .theos -name "MeituanRiderTweak.dylib" -exec cp {} /tmp/out/ \;
          ls -la /tmp/out/
          if [ -f /tmp/out/MeituanRiderTweak.dylib ]; then
            echo "=== otool -hv ==="
            otool -hv /tmp/out/MeituanRiderTweak.dylib
            echo "=== otool -D ==="
            otool -D /tmp/out/MeituanRiderTweak.dylib
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MeituanRiderTweak-dylib
          path: /tmp/out/*.dylib
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
          if-no-files-found: ignore
