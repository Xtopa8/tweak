name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid
          which ldid

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | head -1)
          echo "using $SDK"
          cp -R "$SDK" $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build
        run: |
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee build.log
          echo "=== find outputs ==="
          find .theos -name "MeituanRiderTweak.dylib" -exec ls -la {} \;

      - name: Verify and collect
        run: |
          mkdir -p /tmp/out
          D=$(find .theos -name "MeituanRiderTweak.dylib" | head -1)
          echo "found: $D"
          cp "$D" /tmp/out/MeituanRiderTweak.dylib
          echo "=== file type ==="
          otool -hv /tmp/out/MeituanRiderTweak.dylib
          echo "=== install name ==="
          otool -D /tmp/out/MeituanRiderTweak.dylib || true
          echo "=== segments ==="
          otool -l /tmp/out/MeituanRiderTweak.dylib | grep -A4 "segname\|LC_ID_DYLIB" | head -40
          ls -la /tmp/out/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MeituanRiderTweak-dylib
          path: /tmp/out/*.dylib
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
