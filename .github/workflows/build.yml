name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          if [ -d /tmp/sdks/iPhoneOS14.5.sdk ]; then
            cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/
          else
            SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | head -1)
            cp -R "$SDK" $THEOS/sdks/
          fi
          ls $THEOS/sdks/

      - name: Build
        run: |
          make clean || true
          make FINALPACKAGE=1 2>&1 | tee build.log
          echo "--- find dylib ---"
          find .theos -name "*.dylib" -exec ls -la {} \;

      - name: Sign dylib with ldid
        run: |
          brew install ldid || true
          mkdir -p /tmp/out
          for f in $(find .theos -name "MeituanRiderTweak.dylib"); do
            cp "$f" /tmp/out/
            ldid -S /tmp/out/MeituanRiderTweak.dylib || echo "ldid failed"
          done
          ls -la /tmp/out/
          echo "--- verify LC_ID_DYLIB ---"
          otool -hv /tmp/out/MeituanRiderTweak.dylib || true
          otool -D /tmp/out/MeituanRiderTweak.dylib || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MeituanRiderTweak-dylib
          path: /tmp/out/*.dylib
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
